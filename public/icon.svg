  <path d="M 256 120 C 275 180 300 240 256 295 C 212 240 237 180 256 120 Z" fill="url(#roseGrad)" opacity="0.95" />
  <path d="M 256 295 C 315 285 365 245 380 185 C 340 235 295 270 256 295 Z" fill="#D47B95" opacity="0.85" />
  <path d="M 256 295 C 197 285 147 245 132 185 C 172 235 217 270 256 295 Z" fill="#D47B95" opacity="0.85" />
  <path d="M 256 295 C 330 315 390 285 415 235 C 365 285 305 300 256 295 Z" fill="#9E4760" opacity="0.75" />
  <path d="M 256 295 C 182 315 122 285 97 235 C 147 285 207 300 256 295 Z" fill="#9E4760" opacity="0.75" />
  
  <!-- Golden Core -->
