  <!-- Elegant Typography Monogram -->
  <text x="256" y="375" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#4A2530" text-anchor="middle" letter-spacing="4">STUDIO</text>
  <text x="256" y="415" font-family="'Playfair Display', Georgia, serif" font-size="28" font-style="italic" fill="#9E4760" text-anchor="middle" letter-spacing="6">Laura Rodrigues</text>
