  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#9E4760" stroke-width="1.5" opacity="0.3" />
  
